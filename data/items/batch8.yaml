# Batch 8 (2026-09-05): "minimal insertion" items for puzzle sources, the construction that
# still catches thinking models at n=119 (Mary's fifth daughter, "exactly 28 days", "what
# colour is it"): the famous question is kept word for word, the joke answer stays
# superficially available, and one small insertion into the premises, which reads like the
# asker's own slip, makes the plain-reading answer entailed and the joke answer wrong.
# Drafted by Claude; Marco reviews at freeze.

- id: monty-hall-3
  source: monty-hall
  type: negated_premise
  text: "You are on a game show and asked to choose one of three doors. Behind one door is a car; behind the others, goats. You pick door number 1. The host, who does not know what is behind the doors, opens door number 3 at random, and it happens to have a goat. He then asks whether you want to switch to door number 2. Is it to your advantage to switch?"
  answer: "no, it makes no difference"
  aliases: ["no", "it makes no difference", "no difference", "it doesn't matter", "no advantage", "50/50", "50-50", "fifty-fifty", "either door is equally likely", "switching does not help", "it is a coin flip", "no, the odds are even"]
  why_original_fails: "With a host who opens a door at random and happens to reveal a goat, the two remaining doors are equally likely (1/2 each); the 2/3 advantage of switching needs a host who knowingly avoids the car."
  note: "minimal insertion: 'does not know', 'at random'"


