# Altered Riddles v2 — hand-curated source riddles and trick puzzles.
#
# One entry per source. `text` is the most common wording (the recall probe
# asks models to complete it verbatim, so wording matters). `answer` is the
# canonical answer; `aliases` are other phrasings that count as the same
# answer for the familiarity probe and for scoring the ORIGINAL riddle.
# `family`: riddle | puzzle. The crawsome list is probed separately from
# data/riddles_source.csv and is not duplicated here.
#
# Admission into the benchmark is decided by the recall probe
# (altered_riddles.probe), not by this file.

